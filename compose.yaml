services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: clinical_app
      POSTGRES_PASSWORD: clinical_password
      POSTGRES_DB: clinical_screening

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_app -d clinical_screening"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build: .

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://clinical_app:clinical_password@db:5432/clinical_screening

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "alembic upgrade head &&
             fastapi run app/main.py --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: